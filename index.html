<style>
:root {
  --bg: #F8FAFC; --card: #FFFFFF; --text: #0F172A; --muted: #64748B; --border: #E2E8F0;
  --navy: #0F172A; --accent: #2563EB; --code-bg: #0F172A; --code-fg: #E2E8F0;
  --high-bg: #FEE2E2; --high-fg: #991B1B; --high-bd: #EF4444;
  --med-bg: #FEF3C7; --med-fg: #92400E; --med-bd: #F59E0B;
  --low-bg: #DCFCE7; --low-fg: #166534; --low-bd: #16A34A;
  --pill-bg: #F1F5F9; --shadow: 0 4px 16px rgba(15,23,42,.06);
}
body.dark {
  --bg: #0B1120; --card: #131C31; --text: #F1F5F9; --muted: #94A3B8; --border: #24324D;
  --pill-bg: #1E293B; --shadow: 0 6px 20px rgba(0,0,0,.35);
  --high-bg: rgba(185,28,28,.22); --high-fg: #FCA5A5;
  --med-bg: rgba(180,83,9,.22); --med-fg: #FCD34D;
  --low-bg: rgba(21,128,61,.22); --low-fg: #86EFAC;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg); color: var(--text);
  font-family: "Meiryo UI", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  line-height: 1.5; transition: background .2s, color .2s;
}
.topbar {
  position: sticky; top: 0; z-index: 40;
  background: rgba(15, 23, 42, .95); backdrop-filter: blur(10px);
  border-bottom: 1px solid #1E293B; color: #FFF;
  padding: 10px 20px; display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
}
.brand { display: flex; align-items: center; gap: 9px; font-weight: 800; font-size: 15.5px; letter-spacing: -.2px; }
.brand-badge { background: #2563EB; color: #FFF; font-size: 11px; padding: 2px 8px; border-radius: 99px; }
.top-actions { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
.lang-group { display: inline-flex; background: #0B1120; border: 1px solid #334155; border-radius: 8px; padding: 2px; gap: 2px; }
.lang-pill {
  border: none; background: transparent; color: #94A3B8; padding: 4px 9px; border-radius: 6px;
  font-size: 12px; font-weight: 700; cursor: pointer; transition: .15s;
}
.lang-pill.active { background: #2563EB; color: #FFF; }
.lang-pill:hover:not(.active) { color: #FFF; background: #1E293B; }
.btn {
  border: 1px solid #334155; background: #1E293B; color: #E2E8F0;
  padding: 6px 11px; border-radius: 8px; font-size: 12px; font-weight: 700;
  cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 4px; transition: .15s;
}
.btn:hover { background: #334155; border-color: #60A5FA; }

.wrap { max-width: 1360px; margin: 0 auto; padding: 22px 20px 64px; }
.hero {
  background: linear-gradient(135deg, #0F172A 0%, #1E3A8A 100%);
  color: #FFF; border-radius: 16px; padding: 24px 28px; margin-bottom: 20px;
  box-shadow: 0 10px 30px rgba(15,23,42,.18);
}
.hero h1 { font-size: 25px; font-weight: 800; margin-bottom: 8px; }
.hero p { color: #CBD5E1; font-size: 13.8px; max-width: 900px; }
.kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(155px, 1fr)); gap: 12px; margin-top: 16px; }
.kpi { background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.14); border-radius: 12px; padding: 12px 14px; }
.kpi-n { font-size: 24px; font-weight: 800; color: #38BDF8; }
.kpi-n.red { color: #FCA5A5; } .kpi-n.green { color: #86EFAC; }
.kpi-l { font-size: 11.5px; color: #CBD5E1; margin-top: 2px; }

.svg-box {
  background: #0F172A; border-radius: 16px; padding: 12px; margin-bottom: 20px;
  border: 1px solid #1E293B; box-shadow: var(--shadow);
}
.svg-box .svg-pill { cursor: pointer; transition: opacity .15s; }
.svg-box .svg-pill:hover { opacity: .82; }

.controls {
  position: sticky; top: 53px; z-index: 30;
  background: var(--bg); padding: 10px 0 12px; margin-bottom: 12px;
  display: flex; align-items: center; gap: 9px; flex-wrap: wrap;
  border-bottom: 1px solid var(--border);
}
.search {
  flex: 1; min-width: 220px; padding: 9px 14px; border-radius: 10px;
  border: 1px solid var(--border); background: var(--card); color: var(--text);
  font-size: 13.5px; outline: none;
}
.search:focus { border-color: #2563EB; box-shadow: 0 0 0 3px rgba(37,99,235,.15); }
.chip {
  padding: 6px 12px; border-radius: 99px; font-size: 12px; font-weight: 700;
  border: 1px solid var(--border); background: var(--card); color: var(--muted);
  cursor: pointer; transition: .15s;
}
.chip.active { background: #2563EB; color: #FFF; border-color: #2563EB; }
.count-pill { font-size: 12px; font-weight: 700; color: var(--muted); margin-left: auto; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(560px, 1fr)); gap: 18px; }
@media (max-width: 640px) { .grid { grid-template-columns: 1fr; } }

.card {
  background: var(--card); border: 1px solid var(--border); border-radius: 14px;
  box-shadow: var(--shadow); overflow: hidden; display: flex; flex-direction: column;
  scroll-margin-top: 120px; transition: transform .15s, border-color .15s;
}
.card.flash { border-color: #2563EB; box-shadow: 0 0 0 4px rgba(37,99,235,.28); }
.card-top {
  padding: 14px 16px 12px; border-bottom: 1px solid var(--border);
  display: flex; align-items: flex-start; justify-content: space-between; gap: 10px;
}
.card-title { font-size: 16px; font-weight: 800; }
.card-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
.surf-row { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 6px; }
.surf { font-size: 10.5px; font-weight: 700; padding: 1px 7px; border-radius: 5px; background: var(--pill-bg); color: var(--muted); border: 1px solid var(--border); }
.risk-badge { flex-shrink: 0; font-size: 11.5px; font-weight: 800; padding: 5px 10px; border-radius: 99px; white-space: nowrap; border: 1px solid transparent; }
.risk-high { background: var(--high-bg); color: var(--high-fg); border-color: var(--high-bd); }
.risk-med  { background: var(--med-bg); color: var(--med-fg); border-color: var(--med-bd); }
.risk-low  { background: var(--low-bg); color: var(--low-fg); border-color: var(--low-bd); }

.flow-wrap { padding: 10px 16px 6px; background: var(--pill-bg); border-bottom: 1px solid var(--border); overflow-x: auto; }
.flow-steps { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.fstep { display: inline-flex; align-items: center; gap: 5px; background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 4px 9px; font-size: 11.8px; font-weight: 700; }
.fstep.last-high { background: var(--high-bg); border-color: var(--high-bd); color: var(--high-fg); }
.fstep.last-low  { background: var(--low-bg); border-color: var(--low-bd); color: var(--low-fg); }
.fnum { width: 17px; height: 17px; border-radius: 50%; background: #2563EB; color: #FFF; font-size: 10px; font-weight: 800; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
.farr { color: #64748B; font-weight: 900; font-size: 13px; }

.facts { padding: 12px 16px; display: flex; flex-direction: column; gap: 7px; font-size: 12.6px; }
.fact { display: flex; gap: 8px; align-items: baseline; }
.flbl { flex-shrink: 0; font-size: 11px; font-weight: 800; padding: 2px 7px; border-radius: 5px; background: var(--pill-bg); color: var(--text); min-width: 60px; text-align: center; }
.flbl.warn { background: var(--med-bg); color: var(--med-fg); }

.shot-area { padding: 0 16px 12px; }
.shot-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 560px) { .shot-grid-2 { grid-template-columns: 1fr; } }
.shot-frame { position: relative; border-radius: 10px; overflow: hidden; border: 1px solid var(--border); background: #0B1120; cursor: zoom-in; display: flex; flex-direction: column; }
.shot-frame img { width: 100%; height: 240px; object-fit: contain; display: block; background: #0B1120; }
.shot-bar { display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 6px 10px; background: #0F172A; color: #CBD5E1; font-size: 10.5px; margin-top: auto; white-space: nowrap; }
.shot-bar > span:first-child { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.shot-bar > span:last-child { flex-shrink: 0; }
.real-tag { background: #166534; color: #DCFCE7; font-weight: 800; padding: 1px 7px; border-radius: 99px; font-size: 10.5px; }
.noshot { border: 1.5px dashed var(--border); border-radius: 10px; padding: 10px 14px; font-size: 12px; color: var(--muted); display: flex; align-items: center; justify-content: space-between; }

.cfg-wrap { margin: 0 16px 14px; border-radius: 10px; overflow: hidden; border: 1px solid #1E293B; background: var(--code-bg); }
.cfg-hdr { display: flex; align-items: center; justify-content: space-between; padding: 6px 10px; background: #1E293B; color: #93C5FD; font-family: Consolas, monospace; font-size: 11.5px; gap: 8px; }
.copy-btn { background: #2563EB; color: #FFF; border: none; border-radius: 5px; padding: 3px 9px; font-size: 11px; font-weight: 700; cursor: pointer; flex-shrink: 0; }
.copy-btn:hover { background: #1D4ED8; }
.cfg-wrap pre { padding: 10px 12px; font-family: Consolas, "Cascadia Code", monospace; font-size: 11.6px; line-height: 1.45; color: #A7F3D0; overflow-x: auto; white-space: pre; }
.card-foot { margin-top: auto; padding: 8px 16px; border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; font-size: 11.5px; color: var(--muted); }
.card-foot a { color: #2563EB; font-weight: 700; text-decoration: none; }
.card-foot a:hover { text-decoration: underline; }

.sec-card { margin-top: 28px; background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 20px 22px; box-shadow: var(--shadow); }
.sec-card h2 { font-size: 18px; font-weight: 800; margin-bottom: 10px; }
.chk-grid { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
.chk-pill { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--pill-bg); font-size: 12px; font-weight: 700; cursor: pointer; }
table.pa { width: 100%; border-collapse: collapse; font-size: 12.6px; margin-top: 10px; }
table.pa th, table.pa td { padding: 9px 11px; border-bottom: 1px solid var(--border); text-align: left; }
table.pa th { background: var(--pill-bg); font-weight: 800; }
table.pa a { color: #2563EB; font-weight: 700; text-decoration: none; }

#lightbox { position: fixed; inset: 0; z-index: 99; background: rgba(2,6,23,.88); display: none; align-items: center; justify-content: center; padding: 24px; cursor: zoom-out; }
#lightbox.open { display: flex; }
#lightbox img { max-width: 94vw; max-height: 86vh; border-radius: 10px; box-shadow: 0 20px 50px rgba(0,0,0,.6); }
#lb-cap { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: #0F172A; color: #FFF; padding: 8px 16px; border-radius: 99px; font-size: 13px; border: 1px solid #334155; }
</style>
</head>

    pa_c1: '既存記事・OSS リポジトリ', pa_c2: '対象範囲と主な制約', pa_c3: '実画面画像',
    pa_me_name: '🛡️ AI Privacy Switches 2026（本プロジェクト）',
    pa_me_desc: '26 製品群・68 ツール（欧米＋中国＋IDE＋CLI＋Web）＋ 日中英 SVG マップ ＋ 設定集 ＋ 日本語 Excel/PPT',
    pa_me_shot: '✅ 23 枚検証済',
    count_tpl: (a, b) => `${a} / ${b} 件表示`,
  }
};

const CLI_ENVS = [
  { id: 'claude', label: 'Claude Code', vars: [['CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC','1'],['DISABLE_TELEMETRY','1'],['CLAUDE_CODE_DISABLE_AUTO_MEMORY','1']] },
  { id: 'gemini', label: 'Gemini CLI', vars: [['GEMINI_TELEMETRY_ENABLED','false'],['GEMINI_TELEMETRY_LOG_PROMPTS','false']] },
  { id: 'grok', label: 'Grok Build', vars: [['GROK_TELEMETRY_ENABLED','0'],['GROK_TRACE_UPLOAD','0']] },
  { id: 'gh', label: 'GitHub CLI', vars: [['GH_TELEMETRY','0']] },
  { id: 'opencode', label: 'OpenCode', vars: [['OPENCODE_DISABLE_AUTOUPDATE','1'],['OPENCODE_DISABLE_SHARE','1'],['OPENCODE_DISABLE_MODELS_FETCH','1']] },
  { id: 'pi', label: 'Pi CLI', vars: [['PI_TELEMETRY','0'],['PI_OFFLINE','1']] },
  { id: 't3', label: 'T3 Code ⚠️', vars: [['T3CODE_TELEMETRY_ENABLED','false'],['T3CODE_OTEL_SDK_DISABLED','true'],['OTEL_SDK_DISABLED','true']] },
  { id: 'orca', label: 'Orca', vars: [['ORCA_TELEMETRY_DISABLED','1']] },
  { id: 'codebuddy', label: 'CodeBuddy CLI', vars: [['CODEBUDDY_CODE_ENABLE_TELEMETRY','0'],['CODEBUDDY_ARTIFACT_ENABLED','false']] },
  { id: 'qwen', label: 'Qwen Code', vars: [['QWEN_USAGE_STATISTICS_ENABLED','false'],['QWEN_TELEMETRY_ENABLED','false']] },
  { id: 'minimax', label: 'MiniMax mcode', vars: [['MCODE_DISABLE_TELEMETRY','1']] },
  { id: 'kimi', label: 'Kimi Code', vars: [['KIMI_DISABLE_TELEMETRY','1'],['KIMI_DISABLE_AUTO_MEMORY','1']] },
  { id: 'dsh', label: 'DeepSeek dsh', vars: [['DSH_TELEMETRY_DISABLED','1'],['DSH_TELEMETRY_MODE','DISABLED']] },
  { id: 'aider', label: 'Aider / Goose / Kilo / OpenClaw', vars: [['AIDER_ANALYTICS_DISABLE','true'],['GOOSE_TELEMETRY_OFF','1'],['GOOSE_TELEMETRY_ENABLED','false'],['KILO_TELEMETRY_LEVEL','off'],['OPENCLAW_NO_AUTO_UPDATE','1']] },
];
let SELECTED_CLIS = new Set(CLI_ENVS.map(c => c.id));

function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function setLang(lg) {
  if (!I18N[lg]) lg = 'zh';
  LANG = lg;
  const t = I18N[LANG];
  document.documentElement.lang = t.html_lang;
  document.title = t.page_title;
  ['zh','en','ja'].forEach(k => {
    document.getElementById('svg-' + k).style.display = (k === LANG) ? '' : 'none';
    document.getElementById('btn-' + k).classList.toggle('active', k === LANG);
  });
  document.getElementById('dlXlsx').href = './exports/' + DB.files[LANG][0];
  document.getElementById('dlPptx').href = './exports/' + DB.files[LANG][1];
  document.getElementById('searchInput').placeholder = t.search_ph;
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const k = el.getAttribute('data-i18n');
    if (t[k]) el.textContent = t[k];
  });
  renderCards();
  renderPriorArt();
}

function toggleTheme() {
  document.body.classList.toggle('dark');
  document.getElementById('themeBtn').textContent = document.body.classList.contains('dark') ? '☀️ Light' : '🌙 Dark';
}

function setFilter(f, btn) {
  FILTER = f;
  document.querySelectorAll('.controls .chip').forEach(c => c.classList.remove('active'));
  btn.classList.add('active');
  renderCards();
}

function renderCards() {
  const t = I18N[LANG];
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const list = DB.tools.filter(item => {
    if (FILTER === 'high' && item.risk !== 'high') return false;
    if (FILTER === 'us' && item.camp !== 'us') return false;
    if (FILTER === 'ide' && item.camp !== 'ide') return false;
    if (FILTER === 'cn' && item.camp !== 'cn') return false;
    if (FILTER === 'cfg' && !item['cfg_' + LANG]) return false;
    if (FILTER === 'shot' && !item.shot) return false;
    if (q) {
      const hay = [item.name_zh, item.name_en, item.name_ja, item.sub_zh, item.sub_en, item.sub_ja, item['train_' + LANG], item['cfg_path_' + LANG], item['cfg_' + LANG], ...(item['steps_' + LANG]||[])].join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
  document.getElementById('countPill').textContent = t.count_tpl(list.length, DB.tools.length);

  const grid = document.getElementById('cardGrid');
  grid.innerHTML = list.map(item => {
    const nm = item['name_' + LANG];
    const sub = item['sub_' + LANG];
    const steps = item['steps_' + LANG];
    const train = item['train_' + LANG];
    const mem = item['mem_' + LANG];
    const got = item['gotcha_' + LANG];
    const cfgPath = item['cfg_path_' + LANG];
    const cfgTxt = item['cfg_' + LANG];
    const rCls = 'risk-' + item.risk;
    const rTxt = t['r_' + item.risk];

    const flowHtml = steps.map((st, idx) => {
      const isLast = idx === steps.length - 1;
      const lCls = isLast ? (item.risk === 'low' ? ' last-low' : ' last-high') : '';
      return `<span class="fstep${lCls}"><span class="fnum">${idx+1}</span>${esc(st)}</span>` + (isLast ? '' : '<span class="farr">➔</span>');
    }).join('');

    const renderShotFrame = (shotKey) => {
      const sm = DB.shots[shotKey];
      const cap = sm['cap_' + LANG];
      return `<div class="shot-frame" onclick="openLB('${esc(sm.path)}','${esc(cap)} · ${esc(sm.domain)}')">
        <img src="${esc(sm.path)}" alt="${esc(cap)}" loading="lazy"/>
        <div class="shot-bar"><span><span class="real-tag">📷 ${t.real_tag}</span> &nbsp;${esc(sm.domain)}</span><span>🔍 ${t.zoom_tip}</span></div>
      </div>`;
    };
    let shotHtml = '';
    if (item.shot && DB.shots[item.shot]) {
      if (item.shot2 && DB.shots[item.shot2]) {
        shotHtml = `<div class="shot-area"><div class="shot-grid-2">${renderShotFrame(item.shot)}${renderShotFrame(item.shot2)}</div></div>`;
      } else {
        shotHtml = `<div class="shot-area">${renderShotFrame(item.shot)}</div>`;
      }
    } else {
      shotHtml = `<div class="shot-area"><div class="noshot"><span>🧭 ${t.noshot}</span></div></div>`;
    }

    const cfgHtml = cfgTxt ? `<div class="cfg-wrap">
      <div class="cfg-hdr"><span>⚙️ ${esc(cfgPath)} (${esc(item.cfg_fmt)})</span><button class="copy-btn" onclick="copyText(this.parentElement.nextElementSibling.textContent, this)">${t.copy}</button></div>
      <pre>${esc(cfgTxt)}</pre>
    </div>` : '';

    return `<article class="card" id="tool-${item.id}">
      <div class="card-top">
        <div>
          <div class="card-title">${esc(nm)}</div>
          <div class="card-sub">${esc(sub)}</div>
          <div class="surf-row">${item.surfaces.map(s => `<span class="surf">${esc(s)}</span>`).join('')}</div>
        </div>
        <span class="risk-badge ${rCls}">${rTxt}</span>
      </div>
      <div class="flow-wrap"><div class="flow-steps">${flowHtml}</div></div>
      <div class="facts">
        <div class="fact"><span class="flbl">${t.l_train}</span><span>${esc(train)}</span></div>
        <div class="fact"><span class="flbl">${t.l_mem}</span><span>${esc(mem)}</span></div>
        <div class="fact"><span class="flbl warn">${t.l_got}</span><span>${esc(got)}</span></div>
      </div>
      ${shotHtml}
      ${cfgHtml}
      <div class="card-foot">
        <span>${cfgTxt ? '⚙️ ' + esc(item.cfg_fmt) : '🌐 Web / GUI'}</span>
        <a href="${esc(item.doc)}" target="_blank" rel="noopener">${t.docs}</a>
      </div>
    </article>`;
  }).join('');
}

function renderPriorArt() {
  const t = I18N[LANG];
  const tb = document.getElementById('paBody');
  tb.innerHTML = DB.prior_art.map(p => `
    <tr><td><a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p['name_' + LANG])} ↗</a></td>
    <td><b>${esc(p['cov_' + LANG])}</b> — ${esc(p['lim_' + LANG])}</td><td>${esc(p['sh_' + LANG])}</td></tr>`).join('') + `
    <tr style="background:var(--low-bg);font-weight:700;">
      <td>${t.pa_me_name}</td><td>${t.pa_me_desc}</td><td>${t.pa_me_shot}</td>
    </tr>`;
}

function renderScriptChecks() {
  const box = document.getElementById('cliChecks');
  box.innerHTML = CLI_ENVS.map(c => `<label class="chk-pill"><input type="checkbox" ${SELECTED_CLIS.has(c.id)?'checked':''} onchange="toggleCli('${c.id}', this.checked)"/>${esc(c.label)}</label>`).join('');
  updateScript();
}
function toggleCli(id, on) { if (on) SELECTED_CLIS.add(id); else SELECTED_CLIS.delete(id); updateScript(); }
function setOS(o) {
  OS = o;
  document.getElementById('osUnix').classList.toggle('active', o==='unix');
  document.getElementById('osWin').classList.toggle('active', o==='win');
  document.getElementById('scriptFileLbl').textContent = o==='unix' ? '~/.zshrc  or  ~/.bashrc' : 'Windows PowerShell ($PROFILE)';
  updateScript();
}
function updateScript() {
  const pairs = [['DO_NOT_TRACK','1']];
  CLI_ENVS.forEach(c => { if (SELECTED_CLIS.has(c.id)) pairs.push(...c.vars); });
  let out = '';
  if (OS === 'unix') {
    out = '# AI Agent Anti-Telemetry Hardening (macOS / Linux)\n' + pairs.map(([k,v]) => `export ${k}="${v}"`).join('\n');
  } else {
    out = '# AI Agent Anti-Telemetry Hardening (Windows PowerShell — User Scope)\n' + pairs.map(([k,v]) => `[Environment]::SetEnvironmentVariable("${k}", "${v}", "User")`).join('\n');
  }
  document.getElementById('scriptOut').textContent = out;
}

function copyText(txt, btn) {
  navigator.clipboard?.writeText(txt).catch(() => {});
  const old = btn.textContent;
  btn.textContent = I18N[LANG].copied;
  setTimeout(() => btn.textContent = old, 1400);
}
function openLB(src, cap) {
  document.getElementById('lb-img').src = src;
  document.getElementById('lb-cap').textContent = cap;
  document.getElementById('lightbox').classList.add('open');
}
function closeLB() { document.getElementById('lightbox').classList.remove('open'); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLB(); });

document.querySelectorAll('.svg-pill').forEach(a => {
  a.addEventListener('click', e => {
    e.preventDefault();
    const tid = a.getAttribute('data-tool');
    if (FILTER !== 'all') {
      FILTER = 'all';
      document.querySelectorAll('.controls .chip').forEach(c => c.classList.toggle('active', c.dataset.filter === 'all'));
      document.getElementById('searchInput').value = '';
      renderCards();
    }
    const el = document.getElementById('tool-' + tid);
    if (el) {
      el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      el.classList.add('flash');
      setTimeout(() => el.classList.remove('flash'), 1600);
    }
  });
});

const _p = new URLSearchParams(location.search);
if (_p.get('theme') === 'dark') toggleTheme();
const _ql = _p.get('lang');
setLang((_ql && I18N[_ql]) ? _ql : 'zh');
renderScriptChecks();
</script>
</body>
</html>
